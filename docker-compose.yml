services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    volumes:
      # Place your ADC or service account key at ./gcp-key.json (gitignored)
      - ./gcp-key.json:/tmp/gcp-credentials.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-credentials.json

  frontend:
    build:
      context: ./frontend
      args:
        # Browser calls the backend via the host-exposed port
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
