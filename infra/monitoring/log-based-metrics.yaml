metrics:
  - name: extract_timeout_total
    description: Pre-stream discovery extraction timed out.
    filter: resource.type="cloud_run_revision" AND textPayload:"event=extract_timeout_total"
  - name: firestore_unavailable_total
    description: Firestore was unavailable to the backend.
    filter: resource.type="cloud_run_revision" AND textPayload:"event=firestore_unavailable_total"
  - name: bridge_injection_failure_total
    description: Voice transcript injection into the text session failed.
    filter: resource.type="cloud_run_revision" AND textPayload:"event=bridge_injection_failure_total"
