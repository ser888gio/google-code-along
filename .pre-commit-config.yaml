# .pre-commit-config.yaml
repos:
  # ----------------------------------------------------
  # GENERAL / CONFIG: Whitespace, YAML, TOML, Standard Hooks
  # ----------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^frontend/(dist|build|node_modules)/.*
      - id: end-of-file-fixer
        exclude: ^frontend/(dist|build|node_modules)/.*
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  # ----------------------------------------------------
  # SECURITY: Secret Scanning
  # ----------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # ----------------------------------------------------
  # QUALITY: Typo Checking
  # ----------------------------------------------------
  - repo: https://github.com/crate-ci/typos
    rev: v1.22.2
    hooks:
      - id: typos
        exclude: ^frontend/.*(lock\.json|node_modules).*$

  # ----------------------------------------------------
  # FRONTEND: Biome (Formatter/Linter)
  # ----------------------------------------------------
  - repo: https://github.com/biomejs/pre-commit
    rev: "v0.1.0"
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@1.8.3"]
        files: ^frontend/.*\.(js|ts|jsx|tsx|json)$
        exclude: ^frontend/app/generated/rsSchema\.ts$

  # ----------------------------------------------------
  # SCRIPTS: ShellCheck
  # ----------------------------------------------------
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]

  # ----------------------------------------------------
  # LOCAL HOOKS: Ruff, Mypy, Knip, Debtmap
  # ----------------------------------------------------
  - repo: local
    hooks:
      # BACKEND: Ruff Check (Linting)
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true

      # BACKEND: Ruff Format
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

      # BACKEND: Mypy (Type Checking)
      - id: mypy
        name: mypy check
        entry: bash -c 'backend/.venv/Scripts/python -m mypy backend/'
        language: system
        pass_filenames: false
        files: ^backend/

      # FRONTEND: Knip (Unused code/dependencies)
      - id: knip
        name: run knip
        entry: bash -c 'cd frontend && npx knip'
        language: system
        pass_filenames: false
        files: ^frontend/

      # DEBT: debtmap — block commit if any Critical-tier items are found
      - id: debtmap
        name: debtmap analysis
        entry: bash scripts/debtmap-check.sh
        language: system
        pass_filenames: false
