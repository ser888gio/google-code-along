name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - develop # Triggers on pushes to the main branch

env:
  PROJECT_ID: vw-skda-fskoda-sandbox-jzf
  GAR_LOCATION: europe-west4
  REPOSITORY: business-persona-ai-repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Required for Workload Identity Federation authentication
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.SA_EMAIL }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Configure Docker Auth for Artifact Registry
        run: |-
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      # ==========================================
      # 1. BACKEND SERVICE (europe-west4)
      # ==========================================
      - name: Build and Push Backend Image
        run: |-
          docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }} ./backend
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }}

      - name: Remove GOOGLE_API_KEY plain env var from backend service
        run: |-
          gcloud run services update business-persona-ai-backend \
            --region europe-west4 \
            --remove-env-vars GOOGLE_API_KEY \
            --quiet || true

      - name: Deploy Backend to Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v3.0.1
        with:
          service: business-persona-ai-backend
          region: europe-west4
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }}
          env_vars: |
            GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}
            APP_ENV=production
            BIGQUERY_DATASET=observability
          secrets: |
            GOOGLE_API_KEY=GOOGLE_API_KEY:latest
            GCS_BUCKET_NAME=GCS_BUCKET_NAME:latest
            FIRESTORE_COLLECTION=FIRESTORE_COLLECTION:latest
            FIRESTORE_DATABASE=FIRESTORE_DATABASE:latest
            ADMIN_BEARER_TOKEN=ADMIN_BEARER_TOKEN:latest

      # ==========================================
      # 2. FRONTEND SERVICE (europe-west4)
      # ==========================================
      - name: Build and Push Frontend Image
        run: |-
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ steps.deploy-backend.outputs.url }} \
            --build-arg NEXT_PUBLIC_WS_URL=wss://$(echo "${{ steps.deploy-backend.outputs.url }}" | sed 's|https://||') \
            -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }} \
            ./frontend
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }}

      - name: Deploy Frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3.0.1
        with:
          service: business-persona-ai-frontend
          region: europe-west4
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }}
          secrets: |
            ADMIN_API_TOKEN=ADMIN_BEARER_TOKEN:latest
