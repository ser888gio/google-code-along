name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - develop # Triggers on pushes to the main branch
    paths-ignore:
      - docs/**
      - README.md

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: vw-skda-fskoda-sandbox-jzf
  GAR_LOCATION: europe-west4
  REPOSITORY: business-persona-ai-repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Required for Workload Identity Federation authentication
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Detect deployable changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - '.github/workflows/cicd.yaml'
              - 'backend/**'
            frontend:
              - '.github/workflows/cicd.yaml'
              - 'frontend/**'
            monitoring:
              - '.github/workflows/cicd.yaml'
              - 'infra/monitoring/dashboard.json'

      - name: Authenticate to Google Cloud
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true' || steps.changes.outputs.monitoring == 'true'
        id: auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.SA_EMAIL }}'

      - name: Set up Cloud SDK
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true' || steps.changes.outputs.monitoring == 'true'
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Configure Docker Auth for Artifact Registry
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true'
        run: |-
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Set up Docker Buildx
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true'
        uses: docker/setup-buildx-action@v3

      # ==========================================
      # 0. CLOUD MONITORING DASHBOARD
      # ==========================================
      - name: Create or Update Cloud Monitoring Dashboard
        if: steps.changes.outputs.monitoring == 'true'
        run: |-
          tmp_dashboard="$(mktemp)"
          sed 's/BACKEND_SERVICE_NAME/business-persona-ai-backend/g' infra/monitoring/dashboard.json > "$tmp_dashboard"

          dashboard_id="$(gcloud monitoring dashboards list \
            --project="${{ env.PROJECT_ID }}" \
            --filter='displayName="RS Generator - Phase 6 SLIs"' \
            --format='value(name)' \
            | head -n 1)"

          if [ -n "$dashboard_id" ]; then
            gcloud monitoring dashboards update "$dashboard_id" \
              --project="${{ env.PROJECT_ID }}" \
              --config-from-file="$tmp_dashboard"
          else
            gcloud monitoring dashboards create \
              --project="${{ env.PROJECT_ID }}" \
              --config-from-file="$tmp_dashboard"
          fi

      # ==========================================
      # 1. BACKEND SERVICE (europe-west4)
      # ==========================================
      - name: Build and Push Backend Image
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Remove GOOGLE_API_KEY plain env var from backend service
        if: steps.changes.outputs.backend == 'true'
        run: |-
          gcloud run services update business-persona-ai-backend \
            --region europe-west4 \
            --remove-env-vars GOOGLE_API_KEY \
            --quiet || true

      - name: Deploy Backend to Cloud Run
        if: steps.changes.outputs.backend == 'true'
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v3.0.1
        with:
          service: business-persona-ai-backend
          region: europe-west4
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }}
          env_vars: |
            GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}
            APP_ENV=production
            BIGQUERY_DATASET=observability
          secrets: |
            GOOGLE_API_KEY=GOOGLE_API_KEY:latest
            GCS_BUCKET_NAME=GCS_BUCKET_NAME:latest
            FIRESTORE_COLLECTION=FIRESTORE_COLLECTION:latest
            FIRESTORE_DATABASE=FIRESTORE_DATABASE:latest

      # ==========================================
      # 2. FRONTEND SERVICE (europe-west4)
      # ==========================================
      - name: Resolve Backend URL
        if: steps.changes.outputs.frontend == 'true'
        id: backend-url
        run: |-
          if [ "${{ steps.changes.outputs.backend }}" = "true" ]; then
            backend_url="${{ steps.deploy-backend.outputs.url }}"
          else
            backend_url="$(gcloud run services describe business-persona-ai-backend --region europe-west4 --format='value(status.url)')"
          fi

          backend_host="${backend_url#https://}"
          echo "url=${backend_url}" >> "$GITHUB_OUTPUT"
          echo "ws_url=wss://${backend_host}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Frontend Image
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.backend-url.outputs.url }}
            NEXT_PUBLIC_WS_URL=${{ steps.backend-url.outputs.ws_url }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy Frontend to Cloud Run
        if: steps.changes.outputs.frontend == 'true'
        uses: google-github-actions/deploy-cloudrun@v3.0.1
        with:
          service: business-persona-ai-frontend
          region: europe-west4
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }}
