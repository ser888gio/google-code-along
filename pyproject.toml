[project]
name = "google-code-along"
version = "0.1.0"
description = "AI-powered Requirement Specification (RS) Generator"
dependencies = [
    "fastapi>=0.136.1",
    "google-adk>=1.31.1",
    "google-cloud-firestore>=2.27.0",
    "google-cloud-storage>=3.4.1",
    "google-generativeai>=0.8.6",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "reportlab>=4.4.10",
    "uvicorn[standard]>=0.46.0",
]
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
# Configure Ruff to match your preferences
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Select rules (e.g., E = pycodestyle, F = pyflakes, I = isort)
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
# Enable auto-formatting
quote-style = "double"
indent-style = "space"
